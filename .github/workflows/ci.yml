name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: actions/checkout@v7
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Run Tests
        run: |
          set -eo pipefail
          xcodebuild test \
            -scheme IonicPortals \
            -destination 'platform=iOS Simulator,name=iPhone 17' | xcpretty
  validate-podspec:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: actions/checkout@v7
      - name: Install cocoapods
        run: gem install cocoapods
      - name: Lint Podspec
        run: pod lib lint
